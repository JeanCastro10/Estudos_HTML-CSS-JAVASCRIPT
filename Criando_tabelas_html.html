<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas html</title>
</head>
<body>
    <h1>TABELA SIMPLES</h1>
    <h2>Tabela com Titulo</h2>
    <table>
        <tr>
            <td>Smith</td>
            <td>HTML</td>
            <td>9</td>
        </tr>
        
        <tr>
            <td>Sunday</td>
            <td>Javascript</td>
            <td>10</td>
        </tr>
    </table>

    <!---Tabela com cabeçalho e Rodapé-->

<h2>Tabela com cabeçalho e Roda pé</h2>
<table width = "100%", border = "1">
    <thead>
        <tr>
            <th>Mês</th>
            <th>Horas/Aulas</th>
    </thead>      
    
    <tbody>    
        <tr> 
            <td>Junho</td>
            <td>50</td>
        </tr>
        
        <tr>
            <td>Julho</td>
            <td>50</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <th>Total</th>
            <th>100</th>
        </tr>
    </tfoot>
        
</table>

<!---Tabela com Colspan-->
<h2>Tabela SIMPLES</h2>
<table width = "100%" border="1" >
    <tr>
        <td>Aluno</td>
        <td colspan="2">Disciplina</td>
    </tr>
    <tr>
        <td>Alex</td>
        <td>HTML</td>
        <td>Ambiente Web</td>
    </tr>

</table>

<!---Tabela com Rowspan-->
<h2>Tabela SIMPLES</h2>
<table width = "100%" border="1" >
    <tr>
        <td>Aluno</td>
        <td rowspan="2">Disciplina</td>
    </tr>
    <tr>
        <td>Alex</td>
        <td>HTML</td>
        <td>Ambiente Web</td>
    </tr>

</table>


</body>
</html>
